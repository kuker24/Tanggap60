[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tanggap60"
version = "2.0.0"
description = "SatuAman Tanggap60 Competition MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.32.1",
  "jinja2==3.1.4",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "sqlalchemy==2.0.36",
  "python-multipart==0.0.20",
  "pillow==11.0.0",
  "pypdf==5.1.0",
  "reportlab==4.2.5",
  "itsdangerous==2.2.0",
  "jsonschema==4.23.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
  "mypy==1.13.0",
  "types-jsonschema==4.23.0.20240813",
]
ocr = [
  "pytesseract==0.3.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
packages = ["app"]
warn_unused_ignores = false
check_untyped_defs = false
allow_untyped_defs = true
allow_untyped_calls = true
disable_error_code = ["no-untyped-def", "no-any-return", "misc", "assignment", "attr-defined", "union-attr"]
