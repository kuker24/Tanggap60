name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-dejavu-core
      - run: python -m pip install -e ".[dev,ocr]"
      - run: python scripts/make_demo_fixtures.py
      - run: pytest -q
      - run: ruff check app tests
      - run: mypy app
