{# Floating Rescue Agent Chat — assistive layer, core flow tetap jalan tanpanya. #}
<div id="agent-root" data-case-id="{{ case.case_id }}" data-workspace-url="/cases/{{ case.case_id }}/workspace">
  <button id="agent-fab" type="button" aria-label="Buka pendamping AI Tanggap60" aria-expanded="false" aria-controls="agent-panel">
    <span aria-hidden="true">✦</span> Tanya AI
  </button>
  <section id="agent-panel" role="dialog" aria-label="Tanggap60 AI — pendamping kasus Anda" aria-modal="false" hidden>
    <header class="agent-head">
      <div>
        <strong>Tanggap60 AI</strong>
        <span class="agent-status" id="agent-status" role="status">Siap membantu</span>
      </div>
      <div class="agent-head-actions">
        <button id="agent-speak" type="button" class="btn-text" aria-pressed="false" aria-label="Bacakan jawaban dengan suara">🔈</button>
        <button id="agent-close" type="button" class="btn-text" aria-label="Tutup pendamping AI">Tutup ✕</button>
      </div>
    </header>
    <div id="agent-messages" aria-live="polite" aria-label="Percakapan dengan pendamping AI"></div>
    <div id="agent-quick" class="agent-quick" aria-label="Aksi cepat"></div>
    <form id="agent-form" autocomplete="off">
      <button id="agent-mic" type="button" aria-label="Bicara dengan Tanggap60">🎙</button>
      <label class="sr" for="agent-input">Tulis pesan untuk pendamping AI</label>
      <input id="agent-input" type="text" placeholder="Tulis pesan…" maxlength="2000">
      <button id="agent-send" type="submit" aria-label="Kirim pesan">➤</button>
    </form>
    <p class="agent-note">Pendamping membaca kondisi kasus Anda. Kata sandi, OTP, dan captcha tetap Anda isi sendiri.</p>
  </section>
  <div id="agent-toast" role="status" aria-live="polite"></div>
</div>
