<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="SatuAman Tanggap60 — susun bukti jadi paket yang bisa Anda bawa ke bank, IASC, atau polisi. Tidak mengirim laporan.">
  <title>{% block title %}SatuAman Tanggap60{% endblock %}</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/static/site.webmanifest">
  <link rel="stylesheet" href="/static/app.css?v=aurora-spin">
</head>
<body class="{% block body_mod %}{% endblock %}">
  <!--
    THESIS: Paket bukti di aurora midnight; menolak walnut ORYZO dan tombol oranye.
    OWN-WORLD: Canvas #000, CTA putih, sinyal #0088ff, Inter, kartu 24px, tanpa bayangan.
    STORY: Korban paham ini draf yang mereka bawa, bukan portal resmi; satu aksi per layar.
    FIRST VIEWPORT: Aurora card, H1, dua tombol penuh (putih lalu charcoal), footer legal.
    FORM: Superwhisper (user-pinned Refero superwhisper); seed skip.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <a class="skip" href="#main">Lewati ke isi</a>
  <header class="top">
    <div class="top-inner">
      <a href="/" class="brand" aria-label="SatuAman — beranda">
        <img class="logomark" src="/static/favicon.svg" width="32" height="32" alt="">
        <span class="brand-copy">
          <strong>SatuAman</strong>
          <span class="sub">Tanggap60</span>
        </span>
      </a>
      {% if case is defined %}
      <form class="top-reset" method="post" action="/cases/{{ case.case_id }}/baru" onsubmit="return confirm('Mulai kasus baru? Unggahan ini dihapus permanen.')">
        <button class="btn-text" type="submit">Kasus baru</button>
      </form>
      {% endif %}
    </div>
    {% block stepper %}{% endblock %}
  </header>

  <main id="main" class="shell">
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    <span>Kami tidak mengirim laporan ke bank atau polisi.</span>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js?v=aurora-spin"></script>
</body>
</html>
