{% extends "base.html" %}
{% block title %}Ada yang mencurigakan? — SatuAman{% endblock %}
{% block content %}
<div class="aurora">
<h1>Ada yang mencurigakan?</h1>
<p class="lede">Pilih yang paling dekat dengan kondisi Anda.</p>

<form class="choices" method="post" action="/start" aria-label="Pilih kondisi">
  <input type="hidden" name="mode" value="DEMO">
  <button class="choice primary" name="declared_condition" value="AFTER_LOSS" type="submit">
    <span>
      <b>Sudah terjadi kerugian</b>
      <span class="desc">Unggah bukti. Kami susun agar siap Anda bawa.</span>
    </span>
    <span class="choice-arrow" aria-hidden="true">→</span>
  </button>
  <button class="choice" name="declared_condition" value="BEFORE_LOSS" type="submit">
    <span>
      <b>Belum ada kerugian</b>
      <span class="desc">Cek dulu. Bukan putusan aman atau tidak aman.</span>
    </span>
    <span class="choice-arrow" aria-hidden="true">→</span>
  </button>
</form>
</div>
{% endblock %}
